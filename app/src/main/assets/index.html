<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5f1">
<title>Bar Madrid</title>
<style>
:root{--bg:#f5f2ed;--panel:#ffffff;--ink:#111;--sub:#6d6d6d;--line:#e7e1da;--brand:#8b571a;--brandDark:#5f3510;--green:#1e7850;--danger:#b33b31;--soft:#f1ece5;--shadow:0 5px 20px rgba(43,32,20,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--ink)}body{padding-bottom:82px}button,input,select{font:inherit}button{-webkit-tap-highlight-color:transparent}.app{max-width:820px;margin:auto;min-height:100vh;background:color-mix(in srgb,var(--bg) 45%,#fff)}
.header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--panel) 96%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 13px}.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.brandbox{display:flex;align-items:center;gap:9px;min-width:0}.appAvatar{width:40px;height:40px;border-radius:12px;object-fit:cover;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900;border:1px solid var(--line);flex:0 0 auto}.brand{font-weight:950;font-size:21px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{font-weight:500;font-size:11px;color:var(--sub);display:block;margin-top:2px;letter-spacing:0}.cartchip{border:0;background:color-mix(in srgb,var(--brand) 14%,#fff);color:var(--brandDark);border-radius:999px;padding:8px 11px;font-weight:850;font-size:12px;white-space:nowrap}
.view{display:none}.view.active{display:block}.searchbox{padding:12px 14px 7px;position:sticky;top:61px;background:color-mix(in srgb,var(--bg) 50%,#fff);z-index:35}.searchbox input{width:100%;border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:11px 13px;font-size:15px;outline:none;color:var(--ink)}
.catSection{margin:5px 12px 17px;background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}.catTitle{padding:9px 12px;color:#fff;background:linear-gradient(100deg,var(--brandDark),var(--brand));font-size:17px;font-weight:900}.catTitle span{font-size:13px;font-weight:600;opacity:.94;margin-left:8px}.productGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px;background:color-mix(in srgb,var(--bg) 62%,#fff)}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;min-width:0;box-shadow:0 2px 9px rgba(30,20,10,.045)}.pic{height:190px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line);position:relative}.pic img{width:100%;height:100%;object-fit:contain;padding:7px;background:#fff;display:block}.card.food .pic img,.card.cover .pic img{object-fit:cover;padding:0}.pic .load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:11px;background:#fbfaf8}.meta{padding:9px}.es{font-size:15.5px;line-height:1.2;font-weight:950;color:var(--ink);overflow-wrap:anywhere}.zh{font-size:12px;line-height:1.35;font-weight:400;color:var(--sub);margin-top:4px;min-height:16px}.step{display:flex;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--bg) 65%,#fff);border-radius:12px;padding:4px 5px;margin-top:9px}.step button,.qbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:21px;line-height:1;font-weight:700}.qtynum{font-weight:900;font-size:16px}.empty{padding:28px 15px;text-align:center;color:var(--sub)}
.catHero,.pageHero{padding:14px 14px 5px;display:flex;align-items:center;justify-content:space-between;gap:10px}.pageHero h2,.catHero h2{margin:0;font-size:20px}.backBtn,.outlineBtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:11px;padding:8px 11px;font-weight:800}.primaryBtn{border:0;background:var(--brand);color:#fff;border-radius:11px;padding:10px 13px;font-weight:850}.dangerBtn{border:0;background:#fbe5e2;color:var(--danger);border-radius:11px;padding:10px 13px;font-weight:850}
.orderWrap,.historyWrap,.settingsWrap,.manageWrap{padding:13px}.orderPanel,.settingsPanel,.managePanel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:13px;box-shadow:var(--shadow)}.orderPanel h2,.settingsPanel h2{margin:0 0 11px;font-size:19px}.inputs{display:grid;grid-template-columns:1fr 1.5fr;gap:8px}.inputs input,.form input,.form select{min-width:0;width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:15px;background:var(--panel);color:var(--ink)}.orderList{margin-top:10px}.orderItem{display:grid;grid-template-columns:68px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.orderItem:last-child{border-bottom:0}.thumb{width:68px;height:68px;border-radius:11px;background:white;border:1px solid var(--line);object-fit:contain}.orderItem.food .thumb{object-fit:cover}.oqty{display:flex;align-items:center;gap:7px}.actions{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin-top:13px}.btn{border:0;border-radius:12px;padding:12px 8px;font-weight:850;font-size:14px}.btn.new{background:color-mix(in srgb,var(--brand) 13%,#fff);color:var(--brandDark)}.btn.clear{background:var(--soft);color:var(--ink)}.btn.save{background:var(--green);color:white}.editNote{display:none;background:#fff1d9;border:1px solid #efd3a1;border-radius:10px;padding:9px;margin:8px 0;color:#7b541e;font-size:12px}
.histToolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 2px 10px}.histToolbar .spacer{flex:1}.historyItem{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;padding:12px;box-shadow:var(--shadow);position:relative}.selectBox{display:none;position:absolute;left:8px;top:9px;width:22px;height:22px;accent-color:var(--brand)}.historySelecting .historyItem{padding-left:38px}.historySelecting .selectBox{display:block}.histTop{display:flex;justify-content:space-between;gap:10px}.mesa{font-size:18px;font-weight:900}.time{font-size:11px;color:var(--sub);text-align:right;line-height:1.45}.histProducts{margin-top:8px;display:grid;gap:7px}.histProd{display:grid;grid-template-columns:50px 1fr auto;gap:9px;align-items:center;background:color-mix(in srgb,var(--bg) 55%,#fff);border-radius:10px;padding:6px}.histProd img{width:50px;height:50px;border-radius:8px;object-fit:contain;background:white}.histProd.food img{object-fit:cover}.histQty{font-weight:900;font-size:15px}.histBtns{display:flex;gap:7px;margin-top:9px}.mini{border:0;border-radius:10px;padding:8px 11px;font-weight:800;font-size:12px}.mini.edit{background:color-mix(in srgb,var(--brand) 13%,#fff);color:var(--brandDark)}.mini.del{background:#fbe5e2;color:var(--danger)}
.bottomNav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:100;width:min(820px,100%);height:73px;background:color-mix(in srgb,var(--panel) 98%,transparent);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:5px 5px calc(5px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.06)}.nav{border:0;background:transparent;color:var(--sub);border-radius:12px;font-size:10.5px;font-weight:750;line-height:1.15}.nav b{display:block;font-size:19px;margin-bottom:2px}.nav.active{color:var(--brandDark);background:color-mix(in srgb,var(--brand) 10%,#fff)}
.drawer,.modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.38);display:none;align-items:flex-end}.drawer.open,.modal.open{display:flex}.sheet{width:min(820px,100%);margin:0 auto;background:var(--panel);border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding:14px 14px calc(20px + env(safe-area-inset-bottom));color:var(--ink)}.sheetHead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--panel);padding:4px 0 10px;z-index:2}.sheetHead h3{margin:0;font-size:19px}.x{border:0;background:var(--soft);color:var(--ink);border-radius:50%;width:34px;height:34px;font-size:18px}.catButtons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.catBtn{border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 55%,#fff);border-radius:12px;text-align:left;padding:10px;font-size:13px;font-weight:800;color:var(--ink)}
.manageTop{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.manageTop input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);color:var(--ink)}.mgrRow{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.mgrRow img{width:62px;height:62px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px}.mgrRow.food img{object-fit:cover}.mgrBtns{display:grid;gap:5px}.mgrBtns button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 8px;color:var(--ink)}
.form{display:grid;gap:9px}.form label{font-size:12px;color:var(--sub);font-weight:700}.previewBox{height:220px;background:#fff;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;overflow:hidden}.previewBox img{width:100%;height:100%;object-fit:contain}.previewBox.cover img{object-fit:cover}.formActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}.formActions .wide{grid-column:1/-1}.help{font-size:12px;color:var(--sub);line-height:1.5}.profileRow{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:center}.profileAvatar{width:80px;height:80px;border-radius:18px;object-fit:cover;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:950;font-size:23px}.themePresets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.themePreset{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px;font-weight:800;color:var(--ink)}.swatch{height:16px;border-radius:6px;margin-bottom:6px}.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px}.colorField{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:8px 10px}.colorField input{width:44px;height:32px;border:0;padding:0;background:transparent}.settingsActions{display:grid;gap:8px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#222;color:#fff;border-radius:12px;padding:10px 14px;z-index:300;font-size:13px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1}
@media(min-width:620px){.productGrid{grid-template-columns:repeat(3,1fr)}.pic{height:205px}}@media(max-width:390px){.pic{height:175px}.es{font-size:14.5px}.inputs{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.btn.save{grid-column:1/-1}.colors{grid-template-columns:1fr}.themePresets{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app">
<header class="header"><div class="headrow"><div class="brandbox"><div id="headerAvatar" class="appAvatar">BM</div><div id="headerBrand" class="brand">Bar Madrid<small id="headerSub">Pedido rápido / 快速点单</small></div></div><button id="cartChip" class="cartchip">0 productos / 0件</button></div></header>
<section id="homeView" class="view active"><div class="searchbox"><input id="homeSearch" placeholder="Buscar / 搜索酒水或食品"></div><div id="homeCatalog"></div></section>
<section id="categoryView" class="view"><div class="catHero"><button id="openCatsTop" class="backBtn">☰ Categorías / 分类</button><h2 id="catPageTitle"></h2></div><div class="searchbox"><input id="catSearch" placeholder="Buscar en esta categoría / 分类内搜索"></div><div id="catCatalog"></div></section>
<section id="orderView" class="view"><div class="orderWrap"><div class="orderPanel"><h2>Pedido actual / 当前点单</h2><div class="inputs"><input id="tableNo" inputmode="numeric" placeholder="Mesa / 桌号"><input id="note" placeholder="Nota / 备注（可不填）"></div><div id="editNote" class="editNote"></div><div id="orderList" class="orderList"></div><div class="actions"><button id="newOrder" class="btn new">Nuevo / 新建</button><button id="clearOrder" class="btn clear">Limpiar / 清空</button><button id="saveOrder" class="btn save">Guardar pedido / 保存点单</button></div></div></div></section>
<section id="historyView" class="view"><div class="historyWrap"><div class="pageHero" style="padding:0 2px 10px"><h2>Historial / 历史记录</h2><button id="toggleSelectHistory" class="outlineBtn">Seleccionar / 批量选择</button></div><div id="historyTools" class="histToolbar" style="display:none"><button id="selectAllHistory" class="outlineBtn">Todo / 全选</button><button id="clearHistorySelection" class="outlineBtn">Cancelar / 取消选择</button><span class="spacer"></span><button id="deleteSelectedHistory" class="dangerBtn">Eliminar seleccionados / 删除已选</button></div><div id="historyList"></div></div></section>
<section id="settingsView" class="view"><div class="settingsWrap"><div class="settingsPanel"><h2>Apariencia y app / 界面与软件</h2><div class="profileRow"><div id="profileAvatar" class="profileAvatar">BM</div><div class="form"><label>Nombre de la app / 软件名称</label><input id="appNameInput" value="Bar Madrid"><label>Subtítulo / 副标题</label><input id="appSubInput" value="Pedido rápido / 快速点单"></div></div><div style="margin-top:10px"><label class="outlineBtn" style="display:inline-block">Cambiar avatar / 更换头像<input id="avatarFile" type="file" accept="image/*" hidden></label></div><h3 style="margin:18px 0 6px">Tema / 主题</h3><div class="themePresets"><button class="themePreset" data-theme="warm"><div class="swatch" style="background:#8b571a"></div>Cálido / 暖棕</button><button class="themePreset" data-theme="green"><div class="swatch" style="background:#247257"></div>Verde / 绿色</button><button class="themePreset" data-theme="blue"><div class="swatch" style="background:#275f8d"></div>Azul / 蓝色</button><button class="themePreset" data-theme="wine"><div class="swatch" style="background:#7c2737"></div>Vino / 酒红</button><button class="themePreset" data-theme="dark"><div class="swatch" style="background:#252525"></div>Oscuro / 深色</button><button class="themePreset" data-theme="light"><div class="swatch" style="background:#b46b1f"></div>Claro / 明亮</button></div><div class="colors"><div class="colorField"><span>主色 / Principal</span><input id="brandColor" type="color"></div><div class="colorField"><span>背景 / Fondo</span><input id="bgColor" type="color"></div><div class="colorField"><span>卡片 / Tarjeta</span><input id="panelColor" type="color"></div><div class="colorField"><span>保存按钮 / Guardar</span><input id="greenColor" type="color"></div></div><div class="settingsActions"><button id="saveAppearance" class="primaryBtn">Guardar apariencia / 保存界面</button><button id="openMenuManager" class="outlineBtn">✎ Editar menú / 编辑菜单</button><button id="resetAppearance" class="outlineBtn">Restablecer apariencia / 恢复默认界面</button></div></div></div></section>
<section id="manageView" class="view"><div class="manageWrap"><div class="pageHero" style="padding:0 0 10px"><h2>Editar menú / 编辑菜单</h2><button id="addProduct" class="primaryBtn">＋ Añadir / 新增</button></div><div class="managePanel"><div class="manageTop"><input id="manageSearch" placeholder="Buscar producto / 搜索商品"><button id="resetMenu" class="outlineBtn">Restablecer / 恢复默认菜单</button></div><div id="manageList"></div></div></div></section>
</div>
<nav class="bottomNav"><button class="nav active" data-view="home"><b>⌂</b>Inicio<br>首页</button><button class="nav" data-view="cats"><b>☰</b>Categorías<br>分类</button><button class="nav" data-view="order"><b>▣</b>Pedido<br>点单</button><button class="nav" data-view="history"><b>◷</b>Historial<br>历史</button><button class="nav" data-view="settings"><b>⚙</b>Ajustes<br>设置</button></nav>
<div id="drawer" class="drawer"><div class="sheet"><div class="sheetHead"><h3>Categorías / 分类</h3><button id="closeDrawer" class="x">×</button></div><div id="catButtons" class="catButtons"></div></div></div>
<div id="editorModal" class="modal"><div class="sheet"><div class="sheetHead"><h3 id="editorTitle">Editar producto / 编辑商品</h3><button id="closeEditor" class="x">×</button></div><div class="form"><div id="editPreviewBox" class="previewBox"><img id="editPreview" alt=""></div><label>Imagen / 商品图片</label><input id="editImageFile" type="file" accept="image/*"><div class="help">可以从手机相册选择图片。图片会自动压缩后保存在应用内。</div><label>Nombre español / 西语名称</label><input id="editEs"><label>Nombre chino / 中文名称</label><input id="editZh"><label>Categoría / 分类</label><input id="editCat" list="catDatalist"><datalist id="catDatalist"></datalist><label>Tipo / 类型</label><select id="editKind"><option value="drink">Bebida / 酒水饮料</option><option value="food">Comida / 食品</option></select><label>Modo de imagen / 图片显示</label><select id="editFit"><option value="contain">Completa / 完整显示</option><option value="cover">Llenar / 铺满</option></select><div class="formActions"><button id="deleteProduct" class="dangerBtn">Eliminar / 删除</button><button id="saveProduct" class="primaryBtn">Guardar / 保存</button></div></div></div></div>
<div id="toast" class="toast"></div>
<script>
const DEFAULT_PRODUCTS=REPLACED_PRODUCTS;
const DEFAULT_CATEGORY_ORDER=REPLACED_CATEGORIES;
const $=id=>document.getElementById(id);
const HISTORY_KEY='bm_history_v6',DRAFT_KEY='bm_draft_v6',PRODUCTS_KEY='bm_products_v7',PROFILE_KEY='bm_profile_v7',THEME_KEY='bm_theme_v7';
function storeGet(k){let v='';try{if(window.AndroidStore&&AndroidStore.get)v=AndroidStore.get(k)||''}catch(e){}if(!v)try{v=localStorage.getItem(k)||''}catch(e){}return v}
function storeSet(k,v){try{if(window.AndroidStore&&AndroidStore.set)AndroidStore.set(k,v)}catch(e){}try{localStorage.setItem(k,v)}catch(e){}}
function storeRemove(k){try{if(window.AndroidStore&&AndroidStore.remove)AndroidStore.remove(k)}catch(e){}try{localStorage.removeItem(k)}catch(e){}}
function parse(v,fb){try{return v?JSON.parse(v):fb}catch(e){return fb}}
function deepClone(v){return JSON.parse(JSON.stringify(v))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeCss(c,fb){return /^#[0-9a-f]{6}$/i.test(c||'')?c:fb}
let products=parse(storeGet(PRODUCTS_KEY),null);if(!Array.isArray(products)||!products.length)products=deepClone(DEFAULT_PRODUCTS);
let byId={};let categories=[];function rebuildMaps(){byId=Object.fromEntries(products.map(p=>[p.id,p]));categories=[...DEFAULT_CATEGORY_ORDER.filter(c=>products.some(p=>p.cat===c)),...products.map(p=>p.cat).filter((c,i,a)=>!DEFAULT_CATEGORY_ORDER.includes(c)&&a.indexOf(c)===i)];if(!categories.length)categories=['Sin categoría / 未分类'];}
rebuildMaps();
function saveProducts(){storeSet(PRODUCTS_KEY,JSON.stringify(products));rebuildMaps();renderCats();renderHome();renderCategory();renderOrder();renderManager()}
function migrateHistory(){let h=parse(storeGet(HISTORY_KEY),null);if(Array.isArray(h))return h;for(const k of ['bm_hist_v5','bm_hist_v4','bm_hist_v3']){const old=parse(storeGet(k),null);if(Array.isArray(old)&&old.length){storeSet(HISTORY_KEY,JSON.stringify(old));return old}}return []}
let history=migrateHistory(),draft=parse(storeGet(DRAFT_KEY),{}),current={...((draft&&draft.current)||{})},editId=(draft&&draft.editId)||null,activeCat=categories[0],historySelecting=false,selectedHistory=new Set(),editingProductId=null;
$('tableNo').value=(draft&&draft.table)||'';$('note').value=(draft&&draft.note)||'';
const defaultProfile={name:'Bar Madrid',sub:'Pedido rápido / 快速点单',avatar:''};const defaultTheme={brand:'#8b571a',brandDark:'#5f3510',bg:'#f5f2ed',panel:'#ffffff',green:'#1e7850',ink:'#111111',sub:'#6d6d6d',line:'#e7e1da',soft:'#f1ece5'};
let profile={...defaultProfile,...parse(storeGet(PROFILE_KEY),{})};let theme={...defaultTheme,...parse(storeGet(THEME_KEY),{})};
const presets={warm:{brand:'#8b571a',brandDark:'#5f3510',bg:'#f5f2ed',panel:'#ffffff',green:'#1e7850',ink:'#111111',sub:'#6d6d6d',line:'#e7e1da',soft:'#f1ece5'},green:{brand:'#247257',brandDark:'#17493a',bg:'#f1f5f2',panel:'#ffffff',green:'#247257',ink:'#102018',sub:'#64716b',line:'#dce7e1',soft:'#e9f0ec'},blue:{brand:'#275f8d',brandDark:'#173d60',bg:'#f1f4f7',panel:'#ffffff',green:'#2d7b62',ink:'#101820',sub:'#66717b',line:'#dce3e9',soft:'#e9eef3'},wine:{brand:'#7c2737',brandDark:'#501925',bg:'#f6f1f2',panel:'#ffffff',green:'#2b7655',ink:'#1a1012',sub:'#77666a',line:'#eadde0',soft:'#f1e7e9'},dark:{brand:'#b77934',brandDark:'#7e4a19',bg:'#171717',panel:'#252525',green:'#3c9c72',ink:'#f7f4ef',sub:'#b8b8b8',line:'#3b3b3b',soft:'#303030'},light:{brand:'#b46b1f',brandDark:'#74400e',bg:'#fffaf3',panel:'#ffffff',green:'#27805a',ink:'#131313',sub:'#737373',line:'#eadfce',soft:'#f5eee4'}};
function initials(){return (profile.name||'BM').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'BM'}
function setAvatar(el){el.innerHTML='';if(profile.avatar){const im=document.createElement('img');im.src=profile.avatar;im.style.cssText='width:100%;height:100%;object-fit:cover';el.appendChild(im)}else el.textContent=initials()}
function applyAppearance(){const r=document.documentElement.style;for(const [k,v] of Object.entries(theme)){const map={brand:'--brand',brandDark:'--brandDark',bg:'--bg',panel:'--panel',green:'--green',ink:'--ink',sub:'--sub',line:'--line',soft:'--soft'};if(map[k])r.setProperty(map[k],v)}$('headerBrand').firstChild.textContent=profile.name||'Bar Madrid';$('headerSub').textContent=profile.sub||'';setAvatar($('headerAvatar'));setAvatar($('profileAvatar'));document.title=profile.name||'Bar Madrid';$('appNameInput').value=profile.name||'';$('appSubInput').value=profile.sub||'';$('brandColor').value=safeCss(theme.brand,'#8b571a');$('bgColor').value=safeCss(theme.bg,'#f5f2ed');$('panelColor').value=safeCss(theme.panel,'#ffffff');$('greenColor').value=safeCss(theme.green,'#1e7850')}
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1600)}
function proxyImg(u,fit){if(!u||u.startsWith('data:')||u.startsWith('file:')||u.startsWith('blob:'))return u;const f=fit==='cover'?'cover':'contain';return 'https://wsrv.nl/?url='+encodeURIComponent(u)+'&w=960&h=720&fit='+f+(f==='contain'?'&bg=white':'')+'&output=jpg'}
function imgHtml(p,cls=''){const raw=p.img||'';const src=proxyImg(raw,p.fit);return `<img class="${cls}" src="${esc(src)}" data-direct="${esc(raw)}" alt="${esc(p.es)}" loading="lazy" decoding="async" onload="this.previousElementSibling&&this.previousElementSibling.remove()" onerror="if(this.dataset.stage!=='direct'&&this.dataset.direct){this.dataset.stage='direct';this.src=this.dataset.direct}else{this.onerror=null;this.src='data:image/svg+xml;charset=utf-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23f5f5f5%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 font-size=%2220%22 fill=%22%23999%22%3ESin imagen%3C/text%3E%3C/svg%3E'}">`}
function qty(){return Object.values(current).reduce((a,b)=>a+(+b||0),0)}
function draftSave(){storeSet(DRAFT_KEY,JSON.stringify({table:$('tableNo').value.trim(),note:$('note').value.trim(),current,editId}));updateChip()}
function updateChip(){const n=qty();$('cartChip').textContent=`${n} productos / ${n}件`}
function change(id,d){const n=Math.max(0,(current[id]||0)+d);if(n)current[id]=n;else delete current[id];draftSave();renderOrder();refreshVisibleQty(id)}
function refreshVisibleQty(id){document.querySelectorAll(`[data-qid="${CSS.escape(id)}"]`).forEach(x=>x.textContent=current[id]||0)}
function card(p){return `<article class="card ${p.kind==='food'?'food':''} ${p.fit==='cover'?'cover':''}"><div class="pic"><div class="load">Cargando… / 加载中</div>${imgHtml(p)}</div><div class="meta"><div class="es">${esc(p.es)}</div><div class="zh">${esc(p.zh)}</div><div class="step"><button data-minus="${esc(p.id)}">−</button><span class="qtynum" data-qid="${esc(p.id)}">${current[p.id]||0}</span><button data-plus="${esc(p.id)}">+</button></div></div></article>`}
function bindCards(root){root.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>change(b.dataset.plus,1));root.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>change(b.dataset.minus,-1))}
function splitCat(c){const a=c.split(' / ');return [a[0]||c,a[1]||'']}
function renderHome(){const q=$('homeSearch').value.trim().toLowerCase();let html='';for(const c of categories){const list=products.filter(p=>p.cat===c&&(!q||(p.es+' '+p.zh+' '+p.cat).toLowerCase().includes(q)));if(!list.length)continue;const [es,zh]=splitCat(c);html+=`<section class="catSection"><div class="catTitle">${esc(es)}<span>${esc(zh)}</span></div><div class="productGrid">${list.map(card).join('')}</div></section>`}$('homeCatalog').innerHTML=html||'<div class="empty">Sin resultados / 没有找到产品</div>';bindCards($('homeCatalog'))}
function renderCategory(){if(!categories.includes(activeCat))activeCat=categories[0];const q=$('catSearch').value.trim().toLowerCase();const [es,zh]=splitCat(activeCat||'');$('catPageTitle').textContent=es+' · '+zh;const list=products.filter(p=>p.cat===activeCat&&(!q||(p.es+' '+p.zh).toLowerCase().includes(q)));$('catCatalog').innerHTML=`<section class="catSection"><div class="catTitle">${esc(es)}<span>${esc(zh)}</span></div><div class="productGrid">${list.map(card).join('')}</div></section>`;bindCards($('catCatalog'))}
function renderCats(){$('catButtons').innerHTML=categories.map(c=>{const [es,zh]=splitCat(c);return `<button class="catBtn" data-cat="${esc(c)}">${esc(es)}<br><span style="font-weight:400;color:var(--sub)">${esc(zh)}</span></button>`}).join('');$('catButtons').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;$('drawer').classList.remove('open');showView('category');renderCategory()})}
function renderOrder(){const ids=Object.keys(current).filter(id=>current[id]>0&&byId[id]);updateChip();$('editNote').style.display=editId?'block':'none';$('editNote').textContent=editId?'Editando pedido / 正在编辑历史订单':'';if(!ids.length){$('orderList').innerHTML='<div class="empty">Sin productos / 当前还没有商品</div>';return}$('orderList').innerHTML=ids.map(id=>{const p=byId[id];return `<div class="orderItem ${p.kind==='food'?'food':''}">${imgHtml(p,'thumb')}<div><div class="es">${esc(p.es)}</div><div class="zh">${esc(p.zh)}</div></div><div class="oqty"><button class="qbtn" data-omin="${esc(id)}">−</button><b>${current[id]}</b><button class="qbtn" data-oplus="${esc(id)}">+</button></div></div>`}).join('');$('orderList').querySelectorAll('[data-oplus]').forEach(b=>b.onclick=()=>change(b.dataset.oplus,1));$('orderList').querySelectorAll('[data-omin]').forEach(b=>b.onclick=()=>change(b.dataset.omin,-1))}
function normOldItem(x){const p=byId[x.id];return p?{id:p.id,es:p.es,zh:p.zh,img:p.img,kind:p.kind,fit:p.fit,qty:+(x.qty||x.q||1)}:{id:x.id||'',es:x.es||'',zh:x.zh||'',img:x.img||'',kind:x.kind||'food',fit:x.fit||'cover',qty:+(x.qty||x.q||1)}}
function persistHistory(){storeSet(HISTORY_KEY,JSON.stringify(history))}
function saveOrder(){const table=$('tableNo').value.trim(),ids=Object.keys(current).filter(id=>current[id]>0&&byId[id]);if(!table){toast('请输入桌号 / Introduce mesa');showView('order');return}if(!ids.length){toast('请先添加商品 / Añade productos');return}const now=Date.now(),items=ids.map(id=>{const p=byId[id];return{id,es:p.es,zh:p.zh,img:p.img,kind:p.kind,fit:p.fit,qty:current[id]}});if(editId){const i=history.findIndex(o=>o.id===editId);if(i>=0){history[i]={...history[i],table,note:$('note').value.trim(),items,updatedAt:now}}else editId=null}if(!editId)history.unshift({id:'o'+now+'_'+Math.random().toString(36).slice(2,6),table,note:$('note').value.trim(),items,createdAt:now,updatedAt:now});persistHistory();current={};editId=null;$('tableNo').value='';$('note').value='';storeRemove(DRAFT_KEY);renderOrder();renderHistory();renderHome();renderCategory();toast('已保存 / Guardado');showView('history')}
function timeFmt(t){try{return new Date(t||Date.now()).toLocaleString('zh-CN',{hour12:false})}catch(e){return''}}
function renderHistory(){const root=$('historyList');root.classList.toggle('historySelecting',historySelecting);if(!history.length){root.innerHTML='<div class="empty">Sin historial / 暂无历史记录</div>';return}root.innerHTML=history.map(o=>{const items=(o.items||[]).map(normOldItem);return `<article class="historyItem"><input class="selectBox" type="checkbox" data-sel="${esc(o.id)}" ${selectedHistory.has(o.id)?'checked':''}><div class="histTop"><div><div class="mesa">Mesa ${esc(o.table)} / ${esc(o.table)}号桌</div>${o.note?`<div class="zh" style="margin-top:4px">Nota / 备注：${esc(o.note)}</div>`:''}</div><div class="time">Creado / 创建<br>${timeFmt(o.createdAt||o.created)}<br>Actualizado / 更新<br>${timeFmt(o.updatedAt||o.updated||o.createdAt||o.created)}</div></div><div class="histProducts">${items.map(x=>`<div class="histProd ${x.kind==='food'?'food':''}">${imgHtml(x)}<div><div class="es" style="font-size:13px">${esc(x.es)}</div><div class="zh">${esc(x.zh)}</div></div><div class="histQty">× ${x.qty}</div></div>`).join('')}</div><div class="histBtns"><button class="mini edit" data-edit="${esc(o.id)}">Editar / 编辑</button><button class="mini del" data-del="${esc(o.id)}">Borrar / 删除</button></div></article>`}).join('');root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editOrder(b.dataset.edit));root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteOrder(b.dataset.del));root.querySelectorAll('[data-sel]').forEach(c=>c.onchange=()=>{c.checked?selectedHistory.add(c.dataset.sel):selectedHistory.delete(c.dataset.sel);updateHistoryButtons()});updateHistoryButtons()}
function updateHistoryButtons(){const n=selectedHistory.size;$('deleteSelectedHistory').textContent=`Eliminar ${n} / 删除已选${n?`（${n}）`:''}`;$('selectAllHistory').textContent=(history.length&&n===history.length)?'Ninguno / 取消全选':'Todo / 全选'}
function editOrder(id){const o=history.find(x=>x.id===id);if(!o)return;editId=id;current={};(o.items||[]).map(normOldItem).forEach(x=>{if(byId[x.id])current[x.id]=x.qty});$('tableNo').value=o.table||'';$('note').value=o.note||'';draftSave();renderOrder();renderHome();renderCategory();showView('order');toast('已载入编辑 / Editando')}
function deleteOrder(id){if(!confirm('¿Borrar este pedido? / 确定删除这条订单吗？'))return;history=history.filter(o=>o.id!==id);selectedHistory.delete(id);persistHistory();renderHistory();if(editId===id){editId=null;draftSave()}toast('已删除 / Borrado')}
function resetOrder(){current={};editId=null;$('tableNo').value='';$('note').value='';storeRemove(DRAFT_KEY);renderOrder();renderHome();renderCategory()}
function toggleHistorySelection(){historySelecting=!historySelecting;if(!historySelecting)selectedHistory.clear();$('historyTools').style.display=historySelecting?'flex':'none';$('toggleSelectHistory').textContent=historySelecting?'Terminar / 完成':'Seleccionar / 批量选择';renderHistory()}
function selectAllHistory(){if(selectedHistory.size===history.length)selectedHistory.clear();else history.forEach(o=>selectedHistory.add(o.id));renderHistory()}
function deleteSelectedHistory(){if(!selectedHistory.size){toast('请先选择记录 / Selecciona pedidos');return}if(!confirm(`¿Eliminar ${selectedHistory.size} pedidos? / 确定删除选中的 ${selectedHistory.size} 条记录吗？`))return;history=history.filter(o=>!selectedHistory.has(o.id));selectedHistory.clear();persistHistory();renderHistory();toast('已批量删除 / Eliminados')}
function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(v==='home'){$('homeView').classList.add('active');document.querySelector('[data-view="home"]').classList.add('active');renderHome()}else if(v==='category'){$('categoryView').classList.add('active');document.querySelector('[data-view="cats"]').classList.add('active');renderCategory()}else if(v==='order'){$('orderView').classList.add('active');document.querySelector('[data-view="order"]').classList.add('active');renderOrder()}else if(v==='history'){$('historyView').classList.add('active');document.querySelector('[data-view="history"]').classList.add('active');renderHistory()}else if(v==='settings'){$('settingsView').classList.add('active');document.querySelector('[data-view="settings"]').classList.add('active');applyAppearance()}else if(v==='manage'){$('manageView').classList.add('active');renderManager()}window.scrollTo(0,0)}
function readImage(file,max=1100,quality=.84,square=false){return new Promise((resolve,reject)=>{if(!file){reject();return}const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{let sw=im.width,sh=im.height,sx=0,sy=0;if(square){const s=Math.min(sw,sh);sx=(sw-s)/2;sy=(sh-s)/2;sw=sh=s}const scale=Math.min(1,max/Math.max(sw,sh));const w=Math.max(1,Math.round(sw*scale)),h=Math.max(1,Math.round(sh*scale));const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(im,sx,sy,sw,sh,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality))};im.onerror=reject;im.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
function renderManager(){const q=$('manageSearch').value.trim().toLowerCase();const list=products.filter(p=>!q||(p.es+' '+p.zh+' '+p.cat).toLowerCase().includes(q));$('manageList').innerHTML=list.map(p=>`<div class="mgrRow ${p.kind==='food'?'food':''}">${imgHtml(p)}<div><div class="es">${esc(p.es)}</div><div class="zh">${esc(p.zh)}</div><div class="zh">${esc(p.cat)}</div></div><div class="mgrBtns"><button data-medit="${esc(p.id)}">✎</button><button data-mup="${esc(p.id)}">↑</button><button data-mdown="${esc(p.id)}">↓</button></div></div>`).join('')||'<div class="empty">Sin resultados / 没有找到商品</div>';$('manageList').querySelectorAll('[data-medit]').forEach(b=>b.onclick=()=>openProductEditor(b.dataset.medit));$('manageList').querySelectorAll('[data-mup]').forEach(b=>b.onclick=()=>moveProduct(b.dataset.mup,-1));$('manageList').querySelectorAll('[data-mdown]').forEach(b=>b.onclick=()=>moveProduct(b.dataset.mdown,1))}
function openProductEditor(id){editingProductId=id||null;const p=id?byId[id]:{id:'custom_'+Date.now(),es:'',zh:'',cat:activeCat||categories[0],kind:'food',fit:'cover',img:''};$('editorTitle').textContent=id?'Editar producto / 编辑商品':'Nuevo producto / 新增商品';$('editEs').value=p.es||'';$('editZh').value=p.zh||'';$('editCat').value=p.cat||'';$('editKind').value=p.kind||'food';$('editFit').value=p.fit||'cover';$('editPreview').src=p.img||'';$('editPreviewBox').classList.toggle('cover',(p.fit||'cover')==='cover');$('deleteProduct').style.visibility=id?'visible':'hidden';$('catDatalist').innerHTML=categories.map(c=>`<option value="${esc(c)}"></option>`).join('');$('editorModal').classList.add('open');$('editImageFile').value='';$('editPreview').dataset.newimg=''}
function closeEditor(){$('editorModal').classList.remove('open')}
function saveProductFromEditor(){const es=$('editEs').value.trim(),zh=$('editZh').value.trim(),cat=$('editCat').value.trim();if(!es||!cat){toast('请填写名称和分类 / Completa nombre y categoría');return}if(editingProductId){const p=byId[editingProductId];if(!p)return;Object.assign(p,{es,zh,cat,kind:$('editKind').value,fit:$('editFit').value});if($('editPreview').dataset.newimg)p.img=$('editPreview').dataset.newimg}else{const id='custom_'+Date.now();products.push({id,es,zh,cat,kind:$('editKind').value,fit:$('editFit').value,img:$('editPreview').dataset.newimg||''})}saveProducts();closeEditor();toast('菜单已保存 / Menú guardado')}
function deleteProductFromEditor(){if(!editingProductId)return;if(!confirm('¿Eliminar este producto? / 确定删除这个商品吗？'))return;products=products.filter(p=>p.id!==editingProductId);delete current[editingProductId];saveProducts();draftSave();closeEditor();toast('商品已删除 / Eliminado')}
function moveProduct(id,d){const i=products.findIndex(p=>p.id===id),j=i+d;if(i<0||j<0||j>=products.length)return;[products[i],products[j]]=[products[j],products[i]];saveProducts()}
function resetMenu(){if(!confirm('¿Restablecer el menú original? / 确定恢复默认菜单吗？你的自定义修改会被清除。'))return;products=deepClone(DEFAULT_PRODUCTS);storeRemove(PRODUCTS_KEY);rebuildMaps();renderCats();renderHome();renderCategory();renderOrder();renderManager();toast('已恢复默认菜单 / Restablecido')}
function applyPreset(name){theme={...presets[name]};storeSet(THEME_KEY,JSON.stringify(theme));applyAppearance();toast('主题已应用 / Tema aplicado')}
function saveAppearance(){profile.name=$('appNameInput').value.trim()||'Bar Madrid';profile.sub=$('appSubInput').value.trim();theme.brand=$('brandColor').value;theme.brandDark=shadeColor(theme.brand,-35);theme.bg=$('bgColor').value;theme.panel=$('panelColor').value;theme.green=$('greenColor').value;theme.line=blendHex(theme.panel,theme.ink||'#111111',.12);theme.soft=blendHex(theme.panel,theme.bg,.55);storeSet(PROFILE_KEY,JSON.stringify(profile));storeSet(THEME_KEY,JSON.stringify(theme));applyAppearance();toast('界面已保存 / Guardado')}
function resetAppearance(){profile={...defaultProfile};theme={...defaultTheme};storeRemove(PROFILE_KEY);storeRemove(THEME_KEY);applyAppearance();toast('已恢复默认界面 / Restablecido')}
function hexToRgb(h){h=(h||'#000000').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
function rgbToHex(a){return'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function blendHex(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(A.map((v,i)=>v*(1-t)+B[i]*t))}
function shadeColor(c,p){const a=hexToRgb(c),f=1+p/100;return rgbToHex(a.map(v=>v*f))}

document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{const v=b.dataset.view;if(v==='cats'){$('drawer').classList.add('open');return}showView(v)});$('cartChip').onclick=()=>showView('order');$('openCatsTop').onclick=()=>$('drawer').classList.add('open');$('closeDrawer').onclick=()=>$('drawer').classList.remove('open');$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').classList.remove('open')};$('homeSearch').oninput=renderHome;$('catSearch').oninput=renderCategory;$('tableNo').oninput=draftSave;$('note').oninput=draftSave;$('saveOrder').onclick=saveOrder;$('newOrder').onclick=resetOrder;$('clearOrder').onclick=()=>{current={};draftSave();renderOrder();renderHome();renderCategory()};
$('toggleSelectHistory').onclick=toggleHistorySelection;$('selectAllHistory').onclick=selectAllHistory;$('clearHistorySelection').onclick=()=>{selectedHistory.clear();renderHistory()};$('deleteSelectedHistory').onclick=deleteSelectedHistory;
$('manageSearch').oninput=renderManager;$('addProduct').onclick=()=>openProductEditor(null);$('resetMenu').onclick=resetMenu;$('openMenuManager').onclick=()=>showView('manage');$('closeEditor').onclick=closeEditor;$('editorModal').onclick=e=>{if(e.target===$('editorModal'))closeEditor()};$('saveProduct').onclick=saveProductFromEditor;$('deleteProduct').onclick=deleteProductFromEditor;$('editFit').onchange=()=>$('editPreviewBox').classList.toggle('cover',$('editFit').value==='cover');$('editImageFile').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{const d=await readImage(f,1100,.84,false);$('editPreview').src=d;$('editPreview').dataset.newimg=d}catch(err){toast('图片读取失败 / Error de imagen')}};
$('avatarFile').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{profile.avatar=await readImage(f,420,.86,true);storeSet(PROFILE_KEY,JSON.stringify(profile));applyAppearance();toast('头像已更新 / Avatar actualizado')}catch(err){toast('图片读取失败 / Error de imagen')}};document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>applyPreset(b.dataset.theme));$('saveAppearance').onclick=saveAppearance;$('resetAppearance').onclick=resetAppearance;
applyAppearance();renderCats();renderHome();renderOrder();renderHistory();updateChip();
</script></body></html>
