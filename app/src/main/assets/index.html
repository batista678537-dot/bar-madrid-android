<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bar Madrid</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f6f4f0;color:#222}.wrap{max-width:680px;margin:auto;padding:14px}h1{margin:0 0 8px}.box{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:120px;padding:10px;border:1px solid #ddd;border-radius:10px}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tabs button,.btn,.add{border:0;border-radius:12px;padding:10px 12px}.tabs button{background:#e9e3dc}.tabs .on{background:#8b5a20;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#fff;border-radius:14px;overflow:hidden}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#eee}.info{padding:10px}.es{font-weight:700}.zh{font-size:13px;color:#666}.add{width:100%;margin-top:8px;background:#8b5a20;color:#fff}.order{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.qty button{width:30px;height:30px;border-radius:50%;border:1px solid #ddd;background:#fff}.btn{font-weight:700}.save{background:#20734f;color:#fff}.soft{background:#eee8e1}.history{border-top:1px solid #eee;padding:12px 0}.small{font-size:12px;color:#777}.mini{border:0;border-radius:9px;padding:7px 10px;margin-right:6px}.edit{background:#f3eadc}.del{background:#fbe7e4;color:#a22}</style></head><body><div class="wrap"><h1>Bar Madrid</h1><div class="box"><div class="row"><input id="table" placeholder="桌号"><input id="note" placeholder="备注（可不填）"></div><div id="current"></div><div class="row" style="margin-top:10px"><button class="btn soft" id="new">新建点单</button><button class="btn soft" id="clear">清空当前</button><button class="btn save" id="save">保存记录</button></div></div><div class="box"><input id="search" placeholder="搜索酒水" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box"><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div></div><div class="box"><h2>点单历史记录</h2><div id="history"></div></div></div><script>const P=[{id:1,c:'啤酒',es:'Caña',zh:'小杯生啤',i:'https://upload.wikimedia.org/wikipedia/commons/d/d7/Lager_beer_in_glass.jpg'},{id:2,c:'啤酒',es:'Doble',zh:'大杯生啤',i:'https://upload.wikimedia.org/wikipedia/commons/d/d7/Lager_beer_in_glass.jpg'},{id:3,c:'葡萄酒',es:'Vino tinto',zh:'红葡萄酒',i:'https://upload.wikimedia.org/wikipedia/commons/c/c0/Red_Wine_Glass.jpg'},{id:4,c:'葡萄酒',es:'Vino blanco',zh:'白葡萄酒',i:'https://upload.wikimedia.org/wikipedia/commons/7/71/White_Wine_Glas.jpg'},{id:5,c:'常见酒水',es:'Tinto de verano',zh:'红酒汽水',i:'https://upload.wikimedia.org/wikipedia/commons/8/8c/Tinto_de_verano.jpg'},{id:6,c:'常见酒水',es:'Sangría',zh:'桑格利亚',i:'https://upload.wikimedia.org/wikipedia/commons/0/06/Sangria_in_glass.jpg'},{id:7,c:'调酒',es:'Gin-tonic',zh:'金汤力',i:'https://upload.wikimedia.org/wikipedia/commons/5/58/Gin_Tonic.jpg'},{id:8,c:'鸡尾酒',es:'Mojito',zh:'莫吉托',i:'https://upload.wikimedia.org/wikipedia/commons/8/8e/Mojito_glass.jpg'},{id:9,c:'咖啡',es:'Café solo',zh:'浓缩咖啡',i:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/Espresso_cup.jpg/330px-Espresso_cup.jpg'},{id:10,c:'咖啡',es:'Café con leche',zh:'牛奶咖啡',i:'https://upload.wikimedia.org/wikipedia/commons/9/92/Cafeconleche.jpg'},{id:11,c:'无酒精',es:'Agua',zh:'水',i:'https://upload.wikimedia.org/wikipedia/commons/5/53/Glas_of_water.jpg'},{id:12,c:'无酒精',es:'Coca-Cola',zh:'可乐',i:'https://upload.wikimedia.org/wikipedia/commons/1/1f/Coca-Cola_glass_bottle.jpg'}];const C=['全部','啤酒','葡萄酒','常见酒水','调酒','鸡尾酒','咖啡','无酒精'];let a='全部',cur={},edit=null,h=JSON.parse(localStorage.getItem('bm_hist')||'[]');const $=id=>document.getElementById(id);function rt(){ $('tabs').innerHTML=C.map(x=>`<button class="${x==a?'on':''}" onclick="a='${x}';rt();rp()">${x}</button>`).join('')}function rp(){let q=$('search').value.toLowerCase();$('grid').innerHTML=P.filter(p=>(a=='全部'||p.c==a)&&(`${p.es} ${p.zh}`).toLowerCase().includes(q)).map(p=>`<div class=card><img src="${p.i}"><div class=info><div class=es>${p.es}</div><div class=zh>${p.zh}</div><button class=add onclick="add(${p.id})">加入当前点单</button></div></div>`).join('')}function add(id){cur[id]=(cur[id]||0)+1;rc()}function rc(){let ids=Object.keys(cur);$('current').innerHTML=ids.length?ids.map(id=>{let p=P.find(x=>x.id==id);return `<div class=order><div><b>${p.es}</b><div class=zh>${p.zh}</div></div><div class=qty><button onclick="chg(${id},-1)">−</button> <b>${cur[id]}</b> <button onclick="chg(${id},1)">+</button></div></div>`}).join(''):'<div class=small style="padding:14px 0">当前还没有酒水</div>'}function chg(id,d){cur[id]+=d;if(cur[id]<=0)delete cur[id];rc()}function reset(){cur={};edit=null;$('table').value='';$('note').value='';rc()}function save(){let t=$('table').value.trim();if(!t||!Object.keys(cur).length){alert('请先填写桌号并添加酒水');return}let items=Object.keys(cur).map(id=>{let p=P.find(x=>x.id==id);return{id:p.id,es:p.es,zh:p.zh,q:cur[id]}}),now=Date.now();if(edit){let i=h.findIndex(x=>x.id==edit);h[i]={...h[i],table:t,note:$('note').value.trim(),items,updated:now}}else h.unshift({id:'o'+now,table:t,note:$('note').value.trim(),items,created:now,updated:now});localStorage.setItem('bm_hist',JSON.stringify(h));rh();reset()}function rh(){$('history').innerHTML=h.length?h.map(o=>`<div class=history><b>桌号 ${o.table}</b><div class=small>创建：${new Date(o.created).toLocaleString()}<br>更新：${new Date(o.updated).toLocaleString()}</div><div style="margin:7px 0">${o.items.map(x=>`${x.es} × ${x.q}`).join(' · ')}</div>${o.note?`<div class=small>备注：${o.note}</div>`:''}<div style="margin-top:8px"><button class="mini edit" onclick="ed('${o.id}')">编辑</button><button class="mini del" onclick="del('${o.id}')">删除</button></div></div>`).join(''):'<div class=small>还没有历史记录</div>'}function ed(id){let o=h.find(x=>x.id==id);edit=id;$('table').value=o.table;$('note').value=o.note||'';cur={};o.items.forEach(x=>cur[x.id]=x.q);rc();scrollTo(0,0)}function del(id){if(confirm('确定删除吗？')){h=h.filter(x=>x.id!=id);localStorage.setItem('bm_hist',JSON.stringify(h));rh();if(edit==id)reset()}}$('search').oninput=rp;$('save').onclick=save;$('new').onclick=reset;$('clear').onclick=()=>{cur={};rc()};rt();rp();rc();rh();</script></body></html>
