<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bar Madrid</title><style>:root{--bg:#f5f2ed;--card:#fff;--ink:#1f2328;--muted:#6f7378;--brand:#8b5a20;--brand2:#efe3d4;--ok:#20734f;--line:#e4ddd5;--danger:#a33d31;--shadow:0 5px 18px rgba(45,36,25,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}.app{max-width:720px;margin:0 auto;min-height:100vh;background:#fbfaf8}header{position:sticky;top:0;z-index:20;background:rgba(251,250,248,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:23px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.mode{display:flex;gap:6px;background:#eee8e1;border-radius:12px;padding:4px}.mode button{border:0;background:transparent;border-radius:9px;padding:8px 11px;font-weight:800;color:#5f5a54}.mode button.on{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgba(0,0,0,.08)}.box{margin:14px 16px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:var(--shadow)}.box h2{margin:0 0 10px;font-size:17px}.row{display:flex;gap:9px;flex-wrap:wrap}.row input{flex:1;min-width:130px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;font-size:15px}.current-title{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.badge{font-size:12px;background:var(--brand2);color:#6b4516;padding:5px 9px;border-radius:99px;font-weight:800}.empty{padding:16px 2px;text-align:center;color:var(--muted);font-size:13px}.order{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0ebe5}.order:last-child{border-bottom:0}.es{font-weight:800}.zh{font-size:12px;color:var(--muted);margin-top:2px}.qty{display:flex;align-items:center;gap:8px}.qbtn,.step button{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;font-size:19px;font-weight:700}.qnum{min-width:22px;text-align:center;font-weight:900}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 8px;font-weight:800}.soft{background:#eee8e1;color:#423c36}.save{background:var(--ok);color:white}.warn{background:#f3eadc;color:#6e4815}.search{margin:0 16px 8px}.search input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:white;font-size:15px}.tabs{display:flex;gap:7px;overflow:auto;padding:4px 16px 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{border:0;border-radius:999px;padding:8px 12px;background:#eae5df;white-space:nowrap;font-size:13px;font-weight:700;color:#514c47}.tabs button.on{background:var(--brand);color:white}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px 18px}.card{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow)}.picwrap{position:relative;width:100%;aspect-ratio:1/1;background:#eee}.picwrap img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#8a847d;background:linear-gradient(90deg,#f1eee9,#faf8f5,#f1eee9);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}.info{padding:9px}.card .es{font-size:14px;line-height:1.22}.card .zh{min-height:16px}.cat{font-size:11px;color:#8b7a6a;margin-top:5px}.step{margin-top:9px;display:flex;align-items:center;justify-content:space-between;background:#f8f6f3;border-radius:12px;padding:4px}.step button{background:white}.step .qnum{font-size:16px}.historyItem{padding:12px 0;border-bottom:1px solid #eee}.historyItem:last-child{border-bottom:0}.histTop{display:flex;justify-content:space-between;gap:10px}.mesa{font-weight:900;font-size:17px}.time{font-size:11px;color:var(--muted);text-align:right;line-height:1.45}.histList{font-size:13px;line-height:1.55;margin-top:7px}.histBtns{display:flex;gap:7px;margin-top:8px}.mini{border:0;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:800}.edit{background:#f3eadc;color:#6e4815}.del{background:#fbe7e4;color:var(--danger)}.editBanner{display:none;margin-top:10px;padding:9px 10px;border-radius:10px;background:#fff4df;color:#78521d;font-size:12px;border:1px solid #efd3a2}.footer{height:28px}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:420px){.actions{grid-template-columns:1fr}.card .es{font-size:13px}}</style></head><body><div class="app"><header><div class="top"><div><h1>Bar Madrid</h1><div class="sub">Pedidos / 点单记录</div></div><div class="mode"><button id="drinkMode" class="on">Bebidas<br>饮品</button><button id="foodMode">Comida<br>食物</button></div></div></header><section class="box"><div class="row"><input id="table" inputmode="numeric" placeholder="Mesa / 桌号"><input id="note" placeholder="Nota / 备注（可不填）"></div><div class="current-title"><h2 style="margin:12px 0 0">Pedido actual / 当前点单</h2><span id="count" class="badge">0</span></div><div id="editBanner" class="editBanner"></div><div id="current"></div><div class="actions"><button class="btn warn" id="new">Nuevo / 新建</button><button class="btn soft" id="clear">Limpiar / 清空</button><button class="btn save" id="save">Guardar / 保存</button></div></section><div class="search"><input id="search" placeholder="Buscar / 搜索产品"></div><div class="tabs" id="tabs"></div><main class="grid" id="grid"></main><section class="box"><h2>Historial / 点单历史记录</h2><div id="history"></div></section><div class="footer"></div></div><script src="products.js"></script><script>const FALLBACK={beer:'https://upload.wikimedia.org/wikipedia/commons/d/d7/Lager_beer_in_glass.jpg',redwine:'https://upload.wikimedia.org/wikipedia/commons/c/c0/Red_Wine_Glass.jpg',whitewine:'https://upload.wikimedia.org/wikipedia/commons/7/71/White_Wine_Glas.jpg',coffee:'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fd/Espresso_cup.jpg/640px-Espresso_cup.jpg',tea:'https://upload.wikimedia.org/wikipedia/commons/0/04/Tea_in_a_glass.jpg',food:'https://upload.wikimedia.org/wikipedia/commons/5/57/Patatas_Bravas.jpg',spirit:'https://upload.wikimedia.org/wikipedia/commons/7/75/Whisky_glass.jpg',soft:'https://upload.wikimedia.org/wikipedia/commons/1/1f/Coca-Cola_glass_bottle.jpg',water:'https://upload.wikimedia.org/wikipedia/commons/0/0f/Glass_of_water.jpg',juice:'https://upload.wikimedia.org/wikipedia/commons/0/05/Orange_Juice_1.jpg'};let section='drink',cat='';let cur={};let editId=null;let hist=JSON.parse(localStorage.getItem('bm_hist_v3')||'[]');let imgCache=JSON.parse(localStorage.getItem('bm_img_cache_v3')||'{}');const $=x=>document.getElementById(x);const meta=k=>CATEGORY_META[k]||[k,'','soft'];function cats(){return [...new Set(PRODUCTS.filter(x=>x.section===section).map(x=>x.cat))]}function renderTabs(){const cs=cats();if(!cs.includes(cat))cat=cs[0]||'';$('tabs').innerHTML=cs.map(c=>{const m=meta(c);return `<button class="${c===cat?'on':''}" data-c="${c}">${m[0]} / ${m[1]}</button>`}).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderTabs();renderProducts()})}function renderProducts(){const q=$('search').value.trim().toLowerCase();const list=PRODUCTS.filter(p=>p.section===section&&p.cat===cat&&(!q||(`${p.es} ${p.zh} ${meta(p.cat)[0]} ${meta(p.cat)[1]}`).toLowerCase().includes(q)));$('grid').innerHTML=list.map(p=>`<article class="card"><div class="picwrap"><div class="loading">Foto / 图片</div><img data-id="${p.id}" alt="${p.es}" style="opacity:0"></div><div class="info"><div class="es">${p.es}</div><div class="zh">${p.zh}</div><div class="cat">${meta(p.cat)[0]} / ${meta(p.cat)[1]}</div><div class="step"><button data-minus="${p.id}">−</button><span class="qnum" id="n-${p.id}">${cur[p.id]||0}</span><button data-plus="${p.id}">+</button></div></div></article>`).join('')||'<div class="empty">Sin resultados / 没有找到产品</div>';$('grid').querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>chg(b.dataset.plus,1));$('grid').querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>chg(b.dataset.minus,-1));loadVisibleImages(list)}async function commons(query){const u='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(query)+'&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url%7Cmime&iiurlwidth=600&format=json&origin=*';const r=await fetch(u);const j=await r.json();const pages=Object.values((j.query&&j.query.pages)||{});for(const p of pages){const ii=p.imageinfo&&p.imageinfo[0];if(ii&&ii.thumburl&&ii.mime&&ii.mime.startsWith('image/'))return ii.thumburl}throw new Error('no image')}async function loadVisibleImages(list){const byId=Object.fromEntries(list.map(p=>[p.id,p]));const imgs=[...document.querySelectorAll('img[data-id]')];let idx=0;async function worker(){while(idx<imgs.length){const el=imgs[idx++],p=byId[el.dataset.id],m=meta(p.cat);let src=imgCache[p.id];if(!src){let query=p.es+' bottle product photo';if(m[2]==='food')query=p.es+' food Spain';if(m[2]==='coffee'||m[2]==='tea'||m[2]==='juice'||m[2]==='water')query=p.es+' drink';try{src=await commons(query);imgCache[p.id]=src;localStorage.setItem('bm_img_cache_v3',JSON.stringify(imgCache))}catch(e){src=FALLBACK[m[2]]||FALLBACK.soft}}el.onload=()=>{el.style.opacity=1;const l=el.parentElement.querySelector('.loading');if(l)l.remove()};el.onerror=()=>{el.onerror=null;el.src=FALLBACK[m[2]]||FALLBACK.soft};el.src=src}}await Promise.all([worker(),worker(),worker()])}function chg(id,d){cur[id]=Math.max(0,(cur[id]||0)+d);if(!cur[id])delete cur[id];renderCurrent();const n=$('n-'+id);if(n)n.textContent=cur[id]||0}function renderCurrent(){const ids=Object.keys(cur);$('count').textContent=ids.reduce((s,id)=>s+cur[id],0);$('current').innerHTML=ids.length?ids.map(id=>{const p=PRODUCTS.find(x=>x.id===id);return `<div class="order"><div><div class="es">${p.es}</div><div class="zh">${p.zh}</div></div><div class="qty"><button class="qbtn" data-ci="${id}" data-d="-1">−</button><span class="qnum">${cur[id]}</span><button class="qbtn" data-ci="${id}" data-d="1">+</button></div></div>`}).join(''):'<div class="empty">Sin productos / 当前还没有产品</div>';$('current').querySelectorAll('[data-ci]').forEach(b=>b.onclick=()=>chg(b.dataset.ci,+b.dataset.d));document.querySelectorAll('[id^="n-"]').forEach(el=>{const id=el.id.slice(2);el.textContent=cur[id]||0})}function reset(){cur={};editId=null;$('table').value='';$('note').value='';$('editBanner').style.display='none';renderCurrent();renderProducts()}function save(){const table=$('table').value.trim(),ids=Object.keys(cur);if(!table){alert('Introduce mesa / 请填写桌号');return}if(!ids.length){alert('Añade productos / 请先添加产品');return}const items=ids.map(id=>{const p=PRODUCTS.find(x=>x.id===id);return{id,es:p.es,zh:p.zh,q:cur[id]}}),now=Date.now();if(editId){const i=hist.findIndex(x=>x.id===editId);if(i>=0)hist[i]={...hist[i],table,note:$('note').value.trim(),items,updated:now}}else hist.unshift({id:'o'+now,table,note:$('note').value.trim(),items,created:now,updated:now});localStorage.setItem('bm_hist_v3',JSON.stringify(hist));renderHistory();reset()}function renderHistory(){$('history').innerHTML=hist.length?hist.map(o=>`<div class="historyItem"><div class="histTop"><div><div class="mesa">Mesa ${o.table} / ${o.table}号桌</div>${o.note?`<div class="zh">Nota / 备注：${o.note}</div>`:''}</div><div class="time">Creado / 创建<br>${new Date(o.created).toLocaleString()}<br>Actualizado / 更新<br>${new Date(o.updated).toLocaleString()}</div></div><div class="histList">${o.items.map(x=>`${x.es} × ${x.q}<span class="zh"> ${x.zh}</span>`).join('<br>')}</div><div class="histBtns"><button class="mini edit" data-edit="${o.id}">Editar / 编辑</button><button class="mini del" data-del="${o.id}">Borrar / 删除</button></div></div>`).join(''):'<div class="empty">Sin historial / 暂无历史记录</div>';$('history').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editOrder(b.dataset.edit));$('history').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delOrder(b.dataset.del))}function editOrder(id){const o=hist.find(x=>x.id===id);if(!o)return;editId=id;$('table').value=o.table;$('note').value=o.note||'';cur={};o.items.forEach(x=>cur[x.id]=x.q);$('editBanner').style.display='block';$('editBanner').textContent=`Editando mesa ${o.table} / 正在编辑 ${o.table}号桌`;section=o.items.some(x=>{const p=PRODUCTS.find(z=>z.id===x.id);return p&&p.section==='food'})?'food':'drink';setMode();renderTabs();renderCurrent();window.scrollTo({top:0,behavior:'smooth'})}function delOrder(id){if(confirm('¿Borrar esta orden? / 确定删除这条记录吗？')){hist=hist.filter(x=>x.id!==id);localStorage.setItem('bm_hist_v3',JSON.stringify(hist));renderHistory();if(editId===id)reset()}}function setMode(){$('drinkMode').classList.toggle('on',section==='drink');$('foodMode').classList.toggle('on',section==='food');renderTabs();renderProducts()}$('drinkMode').onclick=()=>{section='drink';setMode()};$('foodMode').onclick=()=>{section='food';setMode()};$('search').oninput=renderProducts;$('save').onclick=save;$('new').onclick=reset;$('clear').onclick=()=>{cur={};renderCurrent();renderProducts()};setMode();renderCurrent();renderHistory();</script></body></html>
