<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5f1"><title>Bar Madrid</title><link rel="stylesheet" href="app.css"></head><body><div class="app">
<header class="header"><div class="headrow"><div class="brandbox"><div id="headerAvatar" class="appAvatar">BM</div><div id="headerBrand" class="brand">Bar Madrid<small id="headerSub">Pedido rápido / 快速点单</small></div></div><button id="cartChip" class="cartchip">0 productos / 0件</button></div></header>
<section id="homeView" class="view active"><div class="searchbox"><input id="homeSearch" placeholder="Buscar / 搜索酒水或食品"></div><div id="homeCatalog"></div></section>
<section id="categoryView" class="view"><div class="catHero"><button id="openCatsTop" class="backBtn">☰ Categorías / 分类</button><h2 id="catPageTitle"></h2></div><div class="searchbox"><input id="catSearch" placeholder="Buscar en esta categoría / 分类内搜索"></div><div id="catCatalog"></div></section>
<section id="orderView" class="view"><div class="orderWrap"><div class="orderPanel"><h2>Pedido actual / 当前点单</h2><div class="inputs"><input id="tableNo" inputmode="numeric" placeholder="Mesa / 桌号"><input id="note" placeholder="Nota / 备注（可不填）"></div><div id="editNote" class="editNote"></div><div id="orderList" class="orderList"></div><div class="actions"><button id="newOrder" class="btn new">Nuevo / 新建</button><button id="clearOrder" class="btn clear">Limpiar / 清空</button><button id="saveOrder" class="btn save">Guardar pedido / 保存点单</button></div></div></div></section>
<section id="historyView" class="view"><div class="historyWrap"><div class="pageHero" style="padding:0 2px 10px"><h2>Historial / 历史记录</h2><button id="toggleSelectHistory" class="outlineBtn">Seleccionar / 批量选择</button></div><div id="historyTools" class="histToolbar" style="display:none"><button id="selectAllHistory" class="outlineBtn">Todo / 全选</button><button id="clearHistorySelection" class="outlineBtn">Cancelar / 取消选择</button><span class="spacer"></span><button id="deleteSelectedHistory" class="dangerBtn">Eliminar seleccionados / 删除已选</button></div><div id="historyList"></div></div></section>
<section id="settingsView" class="view"><div class="settingsWrap"><div class="settingsPanel"><h2>Apariencia y app / 界面与软件</h2><div class="profileRow"><div id="profileAvatar" class="profileAvatar">BM</div><div class="form"><label>Nombre de la app / 软件名称</label><input id="appNameInput" value="Bar Madrid"><label>Subtítulo / 副标题</label><input id="appSubInput" value="Pedido rápido / 快速点单"></div></div><div style="margin-top:10px"><label class="outlineBtn" style="display:inline-block">Cambiar avatar / 更换头像<input id="avatarFile" type="file" accept="image/*" hidden></label></div><h3 style="margin:18px 0 6px">Tema / 主题</h3><div class="themePresets"><button class="themePreset" data-theme="warm"><div class="swatch" style="background:#8b571a"></div>Cálido / 暖棕</button><button class="themePreset" data-theme="green"><div class="swatch" style="background:#247257"></div>Verde / 绿色</button><button class="themePreset" data-theme="blue"><div class="swatch" style="background:#275f8d"></div>Azul / 蓝色</button><button class="themePreset" data-theme="wine"><div class="swatch" style="background:#7c2737"></div>Vino / 酒红</button><button class="themePreset" data-theme="dark"><div class="swatch" style="background:#252525"></div>Oscuro / 深色</button><button class="themePreset" data-theme="light"><div class="swatch" style="background:#b46b1f"></div>Claro / 明亮</button></div><div class="colors"><div class="colorField"><span>主色 / Principal</span><input id="brandColor" type="color"></div><div class="colorField"><span>背景 / Fondo</span><input id="bgColor" type="color"></div><div class="colorField"><span>卡片 / Tarjeta</span><input id="panelColor" type="color"></div><div class="colorField"><span>保存按钮 / Guardar</span><input id="greenColor" type="color"></div></div><div class="settingsActions"><button id="saveAppearance" class="primaryBtn">Guardar apariencia / 保存界面</button><button id="openMenuManager" class="outlineBtn">✎ Editar menú / 编辑菜单</button><button id="resetAppearance" class="outlineBtn">Restablecer apariencia / 恢复默认界面</button></div></div></div></section>
<section id="manageView" class="view"><div class="manageWrap"><div class="pageHero" style="padding:0 0 10px"><h2>Editar menú / 编辑菜单</h2><button id="addProduct" class="primaryBtn">＋ Añadir / 新增</button></div><div class="managePanel"><div class="manageTop"><input id="manageSearch" placeholder="Buscar producto / 搜索商品"><button id="resetMenu" class="outlineBtn">Restablecer / 恢复默认菜单</button></div><div id="manageList"></div></div></div></section>
</div>
<nav class="bottomNav"><button class="nav active" data-view="home"><b>⌂</b>Inicio<br>首页</button><button class="nav" data-view="cats"><b>☰</b>Categorías<br>分类</button><button class="nav" data-view="order"><b>▣</b>Pedido<br>点单</button><button class="nav" data-view="history"><b>◷</b>Historial<br>历史</button><button class="nav" data-view="settings"><b>⚙</b>Ajustes<br>设置</button></nav>
<div id="drawer" class="drawer"><div class="sheet"><div class="sheetHead"><h3>Categorías / 分类</h3><button id="closeDrawer" class="x">×</button></div><div id="catButtons" class="catButtons"></div></div></div>
<div id="editorModal" class="modal"><div class="sheet"><div class="sheetHead"><h3 id="editorTitle">Editar producto / 编辑商品</h3><button id="closeEditor" class="x">×</button></div><div class="form"><div id="editPreviewBox" class="previewBox"><img id="editPreview" alt=""></div><label>Imagen / 商品图片</label><input id="editImageFile" type="file" accept="image/*"><div class="help">可以从手机相册选择图片。图片会自动压缩后保存在应用内。</div><label>Nombre español / 西语名称</label><input id="editEs"><label>Nombre chino / 中文名称</label><input id="editZh"><label>Categoría / 分类</label><input id="editCat" list="catDatalist"><datalist id="catDatalist"></datalist><label>Tipo / 类型</label><select id="editKind"><option value="drink">Bebida / 酒水饮料</option><option value="food">Comida / 食品</option></select><label>Modo de imagen / 图片显示</label><select id="editFit"><option value="contain">Completa / 完整显示</option><option value="cover">Llenar / 铺满</option></select><div class="formActions"><button id="deleteProduct" class="dangerBtn">Eliminar / 删除</button><button id="saveProduct" class="primaryBtn">Guardar / 保存</button></div></div></div></div>
<div id="toast" class="toast"></div><script src="catalog0.js"></script><script src="catalog1.js"></script><script src="catalog2.js"></script><script src="catalog3.js"></script><script src="catalog4.js"></script><script src="categories.js"></script><script src="app.js"></script></body></html>
